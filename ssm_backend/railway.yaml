# Railway Production Configuration
services:
  ssm-backend:
    build:
      builder: NIXPACKS
      nixpacksConfig:
        providers:
          - python
        python:
          version: "3.11"
    deploy:
      startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    env:
      PYTHON_VERSION: 3.11
